<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Jeu télé – manette</title>
<link rel="stylesheet" href="css/manette.css">
</head>
<body>
<div id="haut">
  <div id="titre"><span id="pastille"></span><span id="monNom">Manette</span></div>
  <div id="etat">Connexion…</div>
</div>

<!-- Profil : pseudo + couleur -->
<section class="ecran" id="ecranProfil">
  <h1>Qui es-tu ?</h1>
  <input id="champNom" maxlength="14" placeholder="Ton pseudo" autocomplete="off">
  <div id="choixCouleurs"></div>
  <button class="gros" id="okProfil">C'est parti !</button>
</section>

<!-- Menu : catalogue + paramètres -->
<section class="ecran" id="ecranMenu">
  <nav id="onglets">
    <button data-onglet="jeux" class="actif">🎮 Jeux</button>
    <button data-onglet="params">⚙️ Réglages</button>
    <button data-onglet="moi">👤 Moi</button>
  </nav>
  <div class="onglet" id="ongletJeux"></div>
  <div class="onglet" id="ongletParams"></div>
  <div id="presents"></div>
</section>

<!-- En jeu : croix + boutons -->
<section class="ecran" id="ecranJeu">
  <div id="barreHaut">
    <span id="nomJeu"></span>
    <button id="boutonMenu">⏸ Menu</button>
  </div>
  <div id="zone">
    <div id="pad">
      <div class="dir" id="h">▲</div>
      <div class="dir" id="g">◀</div>
      <div class="dir" id="d">▶</div>
      <div class="dir" id="b">▼</div>
    </div>
    <div id="boutons"></div>
  </div>
</section>

<div id="message"><div><div id="msgTexte"></div><button id="msgBouton">Réessayer</button></div></div>

<script src="lib/peerjs.min.js"></script>
<script src="js/manette.js"></script>
</body>
</html>
