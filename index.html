<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeu télé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<script>document.write('<link rel="stylesheet" href="css/console.css?v=' + Date.now() + '">');</script>
</head>
<body>
<!-- Le canvas sert aux jeux. Le menu est en HTML par-dessus. -->
<canvas id="jeu"></canvas>

<!-- ===== Écran menu ===== -->
<div id="menu">
  <header>
    <div class="logo"><span class="manette">🎮</span><span><span class="l1">Jeu</span> <span class="l2">télé</span></span></div>
    <div class="droite">
      <div id="etat">Connexion au serveur…</div>
      <button id="pleinEcran">⛶ Plein écran</button>
    </div>
  </header>

  <main>
    <section id="colonneGauche">
      <div class="carte" id="carteQR">
        <h2>Rejoindre</h2>
        <div id="qr">…</div>
        <div id="salle">-----</div>
        <div class="petit" id="lien"></div>
      </div>
      <div class="carte">
        <h2>Joueurs <span id="compteJoueurs"></span></h2>
        <div id="listeJoueurs"></div>
      </div>
    </section>

    <section id="colonneDroite">
      <div class="carte" id="carteCatalogue">
        <h2>Catalogue</h2>
        <div id="catalogue"></div>
        <div id="detail"></div>
        <div class="aide">Choisis un jeu sur ton téléphone (ou avec les flèches de la télécommande puis OK).</div>
      </div>
      <div class="carte" id="carteParams">
        <h2>Paramètres</h2>
        <div id="params"></div>
        <div class="aide">Modifiables depuis l'onglet ⚙️ des téléphones.</div>
      </div>
    </section>
  </main>
</div>

<!-- ===== Barre pendant un jeu ===== -->
<div id="barreJeu">
  <div id="miniQR"></div>
  <div>
    <div id="nomJeu"></div>
    <div class="petit">Bouton ⏸ sur le téléphone (ou Retour sur la télécommande) pour revenir au menu</div>
  </div>
  <div id="miniJoueurs"></div>
</div>

<div id="toast"></div>

<script>
// Chaque fichier est chargé avec ?v=… pour ne jamais tomber sur une vieille version gardée en cache.
// Les jeux du catalogue : ajouter une ligne par nouveau jeu.
(function () {
  var v = Date.now();
  ['lib/peerjs.min.js',
   'lib/qrcode.js',
   'js/console.js',
   'jeux/fiesta/outils.js',
   'jeux/fiesta/plateau.js',
   'jeux/fiesta/minijeux.js',
   'jeux/fiesta/minijeux2.js',
   'jeux/fiesta/fiesta.js',
   'jeux/commun/lien.js',
   'jeux/quiz/questions.js',
   'jeux/quiz/quiz.js',
   'jeux/dino/dino.js',
   'jeux/magnats/magnats.js',
   'jeux/archers/archers.js',
   'jeux/commun/cartes.js',
   'jeux/poker/poker.js',
   'jeux/commun/kenney3d.js',
   'jeux/kart/rendu3d.js',
   'jeux/kart/kart.js',
   'jeux/dessin/dessin.js',
   'jeux/hexgl.js',
   'jeux/test-manettes.js'
  ].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
})();
</script>
<script>Console.demarrer();</script>
</body>
</html>
